<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이야기 우체국</title>

    <!-- 글꼴 (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/common-style.css">
    <link rel="stylesheet" href="css/index-style.css">
</head>
<body>
    <div class="container hub">

        <!-- 헤더 -->
        <header class="header">
            <a href="index.html" class="logo">이야기 우체국</a>
        </header>

        <main class="hub-main">

            <!-- 제목 -->
            <section class="hub-head">
                <h1 class="hub-title">오늘은 어떤 이야기를<br>건네 볼까요?</h1>
                <p class="hub-desc">마음을 적어 보내는 카드부터, 잠들기 전 듣는 동화까지</p>
            </section>

            <!-- 세 개의 창구 -->
            <ul class="panels">

                <!-- 1. 메시지 카드 사이트 -->
                <li class="panel-item">
                    <a href="message/index.html" class="panel panel-message">
                        <span class="panel-bg"></span>
                        <span class="panel-body">
                            <span class="panel-label">카드 메시지</span>
                            <h2 class="panel-title">마음편지</h2>
                            <p class="panel-desc">카드를 골라 마음을 적고, 링크로 전해요</p>
                            <span class="panel-cta">들어가기</span>
                        </span>
                    </a>
                </li>

                <!-- 2. 동화 읽어주기 사이트 -->
                <li class="panel-item">
                    <a href="story/index.html" class="panel panel-story">
                        <span class="panel-bg"></span>
                        <span class="panel-body">
                            <span class="panel-label">동화</span>
                            <h2 class="panel-title">달님 동화</h2>
                            <p class="panel-desc">잠들기 전, 한 장씩 넘기며 읽는 이야기</p>
                            <span class="panel-cta">들어가기</span>
                        </span>
                    </a>
                </li>

                <!-- 3. 미정 -->
                <li class="panel-item">
                    <div class="panel panel-next is-soon">
                        <span class="panel-mark" aria-hidden="true">?</span>
                        <span class="panel-body">
                            <span class="panel-label">새 창구</span>
                            <h2 class="panel-title">다음 이야기</h2>
                            <p class="panel-desc">어떤 이야기가 들어올지 아직 비밀이에요</p>
                            <span class="panel-badge">준비 중</span>
                        </span>
                    </div>
                </li>

            </ul>
        </main>

        <footer class="footer">
            <p>&copy; 2026 이야기 우체국</p>
        </footer>

    </div>
</body>
</html>
